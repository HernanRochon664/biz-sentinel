version: 1

disable_existing_loggers: False

formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: INFO
    formatter: simple
    filename: logs/biz_sentinel.log
    mode: a

root:
  level: INFO
  handlers: [console, file]

loggers:
  kedro:
    level: INFO
    handlers: [console, file]
    propagate: no

  biz_sentinel:
    level: INFO
    handlers: [console, file]
    propagate: no