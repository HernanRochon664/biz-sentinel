# BizSentinel Docker Compose — Production Profile
#
# Usage:
#   Start all services:  docker compose -f docker/docker-compose.yml up -d
#   Access points:
#     Landing page:  http://localhost:8055  (start here)
#     Dashboard:     http://localhost:8050
#     AI Chat:       http://localhost:8060
#     API docs:      http://localhost:8000/docs
#     MLflow UI:     http://localhost:5000
#
# Prerequisites:
#   - Copy .env.example to .env and fill required values
#   - HMAC_SALT and SECRET_KEY must be set before running
#   - Olist data CSVs must be in data/01_raw/ before running pipelines
#   - Ollama must be running on host with qwen2.5-coder:7b for AI Chat
#
# Profiles:
#   landing-only — starts only the landing page and its API dependency.
#                  Use with: docker compose --profile landing-only up -d
#                  Dockerfile.dashboard can be used for a lightweight
#                  cloud deployment of just the serving layer.

services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.2
    container_name: biz_sentinel_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlruns
      - mlflow_artifacts:/mlartifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root /mlartifacts
    environment:
      - MLFLOW_TRACKING_URI=http://localhost:5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: biz_sentinel_app
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ../data:/app/data
      - ../conf:/app/conf
      - ../logs:/app/logs
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=${DATABASE_URL}
      - HMAC_SALT=${HMAC_SALT}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=production
    env_file:
      - ../.env
    restart: unless-stopped

  api:
    profiles:
      - landing-only
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: biz_sentinel_api
    command: uvicorn biz_sentinel.serving.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: biz_sentinel_dashboard
    command: python -m biz_sentinel.serving.dashboard.app
    ports:
      - "8050:8050"
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=production
    env_file:
      - ../.env
    restart: unless-stopped

  landing:
    profiles:
      - landing-only
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard  # lightweight; swap to Dockerfile for full stack
    container_name: biz_sentinel_landing
    command: python -m biz_sentinel.serving.dashboard.landing
    ports:
      - "8055:8055"
    depends_on:
      - api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=production
    env_file:
      - ../.env
    restart: unless-stopped

  chat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: biz_sentinel_chat
    command: python -m biz_sentinel.serving.dashboard.chat
    ports:
      - "8060:8060"
    depends_on:
      - api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - ENVIRONMENT=production
    env_file:
      - ../.env
    restart: unless-stopped

  # MCP server runs via stdio — use: make mcp
  # Not included as a Docker service (stdio transport is not HTTP-based)

volumes:
  mlflow_data:
  mlflow_artifacts:

networks:
  default:
    name: biz_sentinel_network