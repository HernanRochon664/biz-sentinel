[project]
name = "biz-sentinel"
version = "0.1.0"
description = "Business monitoring and anomaly detection system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
    "shap>=0.46.0,<0.51.0",
    "diffprivlib>=0.2.1",
    "kedro>=0.19.5",
    "prefect>=2.19.0",
    "mlflow>=2.13.2",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "dash>=2.17.0",
    "plotly>=5.22.0",
    "fastmcp>=0.1.0",
    "pydantic>=2.7.1",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "rapidfuzz>=3.9.1",
    "sqlalchemy>=2.0.30",
    "jupyterlab>=4.5.7",
    "ipykernel>=7.2.0",
    "seaborn>=0.13.2",
    "ollama>=0.6.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.366",
    "ruff>=0.4.4",
    "pytest>=8.2.1",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
per-file-ignores = {"src/biz_sentinel/serving/api/*.py" = ["B008"]}

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html -m 'not integration'"
markers = ["integration: marks tests as integration tests (deselect with -m 'not integration')"]

[tool.kedro]
package_name = "biz_sentinel"
project_name = "BizSentinel"
kedro_init_version = "1.3.x"
source_dir = "src"

[tool.kedro_telemetry]
project_id = "75ec6be58bc24a8e9200733f8c18753b"
